# nginx server for the admin CMS static bundle — ROOT layout (split-host).
#
# The sibling of apps/admin/nginx.conf, which serves the same bundle under the
# `/cms/` prefix. apps/admin/Dockerfile picks between the two on the
# VITE_BASE_PATH build arg; they must never both be installed.
#
# This variant is for the layout where the CMS has its OWN hostname
# (`admin_domain_name` in modules/stack, e.g. cms.krutyug.ai) and owns that
# host's catch-all on the ALB. Matching build: VITE_BASE_PATH=/ so Vite emits
# `/assets/*`, plus VITE_API_URL — at root the SPA is a different origin from the
# API and can no longer use window.location.origin.
#
# Runs inside nginxinc/nginx-unprivileged (non-root, uid 101) listening on 8080 —
# the container port the ALB target group health-checks and forwards to.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # ALB target-group health check — always 200, unauthenticated, cheap.
    # Declared BEFORE the catch-all and as an exact match, so it is never served
    # index.html by the SPA fallback below (a 200 with an HTML body would still
    # pass the health check, but for the wrong reason — it would keep reporting
    # healthy after the bundle went missing).
    location = /health {
        access_log   off;
        default_type text/plain;
        return       200 'ok';
    }

    # SPA at root with client-side-routing fallback, so deep-link reloads
    # (/taxonomy/deities) return index.html instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
