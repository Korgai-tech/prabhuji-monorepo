# nginx server for the admin CMS static bundle (TAM-120).
# Runs inside nginxinc/nginx-unprivileged (non-root, uid 101) which listens on
# 8080 — the container port the ALB target group health-checks and forwards to.
#
# The SPA is served under the `/cms/` prefix to match Vite `base: '/cms/'` and
# the react-router `basename` — the API owns the ALB catch-all, so admin lives
# under a dedicated prefix. The build output is copied to
# /usr/share/nginx/html/cms/ (see apps/admin/Dockerfile), so `/cms/assets/*`
# resolves to real files and unknown client-side routes fall back to
# `/cms/index.html` (SPA deep-link reloads never 404).
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # ALB target-group health check — always 200, unauthenticated, cheap.
    location = /health {
        access_log   off;
        default_type text/plain;
        return       200 'ok';
    }

    # SPA under /cms/ with client-side-routing fallback to index.html.
    location /cms/ {
        try_files $uri $uri/ /cms/index.html;
    }

    # Bare /cms (no trailing slash) -> /cms/ so the base path resolves.
    location = /cms {
        return 308 /cms/;
    }
}
