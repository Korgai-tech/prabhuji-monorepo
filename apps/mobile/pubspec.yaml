  # Fonts bundled into the app so `google_fonts` can resolve them offline
  # (the emulator has no internet; google_fonts.allowRuntimeFetching is off
  # in main.dart). Weights match the tokens in lib/core/theme.dart.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        # Inter Bold — required by the Books chapters-drawer book title (TAM-76,
        # Figma node 637:4424 = Inter 700 16/20). Without it, google_fonts
        # (allowRuntimeFetching:false in tests) throws instead of rendering.
        # Inter v4.0 extras/otf, same family + format as the weights above.
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
    - family: Libre Caslon Text
      fonts:
        - asset: assets/fonts/LibreCaslonText-Bold.ttf
          weight: 700
    # Montserrat SemiBold (weight 600) — required by the v2 mini-player title
    # (TAM-N-mini-player-v2, Figma node 1950:20915 → Montserrat 12/14.6 w600).
    # Bundled as a Google Fonts variable TTF (single asset, weight-axis
    # selectable) rather than a runtime google_fonts fetch: main.dart sets
    # GoogleFonts.config.allowRuntimeFetching = false, and the tests would
    # throw with a runtime-fetch path (figma-flutter skill Trap
    # "google_fonts in tests"). Only weight 600 is registered because that is
    # the only weight the v2 mini-player uses.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 600
    # Poppins — required by TAM-160 paywall v1 (`card_hero`) design tokens:
    #   * "Free trial" pill title (Poppins Bold 16)
    #   * "for 3 days, then ₹299/month" subtitle (Poppins Medium 12)
    #   * "Cancel Anytime" / "Refund Policy" row (Poppins Regular 12)
    # Bundled to keep `GoogleFonts.config.allowRuntimeFetching = false` valid.
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

