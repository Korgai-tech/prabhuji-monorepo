name: custom_analytics_flutter
description: Custom analytics Flutter SDK. Amplitude-shaped public API, SQLite-backed offline queue, session lifecycle, ships batches over HTTP to a self-hosted collector.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
