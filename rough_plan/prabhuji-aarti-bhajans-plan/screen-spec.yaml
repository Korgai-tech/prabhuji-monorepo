product_intent:
  purpose: "Provide a calm devotional audio streaming area for Aarti, Bhajan, and related long-form devotional audio."
  primary_user_goal: "Browse devotional audio by section, category, or deity and listen daily without generic platform noise."
  primary_business_goal: "Convert users to Pro by making audio playback a paid daily-retention feature while keeping discovery free."
  design_principle:
    - "DP01: Devotional First, Feed Second"
    - "DP02: Preserve Sacred Visual Dignity"
    - "DP03: Calm Rituals, Clear Controls"
    - "DP05: Pro as Added Devotional Value"
    - "DP08: Lightweight, Readable, Small-Screen First"

access_model:
  free_user:
    can_view:
      - "Aarti & Bhajans main page"
      - "Recently Played section if user has history"
      - "Deities section"
      - "Browse Categories section"
      - "Newly Added section"
      - "Most Played on Prabhuji section"
      - "Category filtered 2-column listings"
      - "Deity filtered 2-column listings"
      - "Show all 2-column listings"
      - "Audio artwork and titles in browse/listing surfaces"
    can_do:
      - "Open module from Home"
      - "Tap category cards"
      - "Tap deity cards"
      - "Tap Show all"
      - "Browse all listing screens"
    paywall_triggers:
      - trigger: "Tap any audio item with intent to play"
        result: "Open unified paywall"
        confidence: "confirmed"
    should_not_show:
      - "Paywall on module entry"
      - "Paywall on category tap"
      - "Paywall on deity tap"
      - "Paywall on Show all tap"
      - "Lock badges on browse cards"
      - "Pro labels on audio cards"
      - "Unlocked player before purchase"
      - "Player like/share actions before purchase"
    post_purchase_behavior:
      result: "Open the originally tapped audio item in the player and auto-start playback."
      preserve_context:
        - "audio_id"
        - "source_list_type"
        - "source_filter"
        - "queue_order"
        - "scroll_position_if_possible"
      confidence: "confirmed"
  pro_user:
    can_view:
      - "All browse surfaces available to free users"
      - "Unlocked full audio player"
      - "In-app mini-player after playback starts"
    can_do:
      - "Stream audio"
      - "Auto-start playback on item tap"
      - "Pause/resume playback"
      - "Seek with progress bar"
      - "Rewind 10 seconds"
      - "Forward 10 seconds"
      - "Use previous and next within queue"
      - "Like/favorite audio items"
      - "Share item links through native share sheet"
    paywall_triggers: []
    should_not_show:
      - "Playback paywall"
      - "Aggressive Pro prompts during playback"
      - "Lock badges on browse surfaces"

screen_structure:
  sections:
    - id: "entry_from_home"
      name: "Entry from Home"
      source: "Home feature card and module main page node 412:2656"
      visible_elements:
        - "Top nav with back arrow"
        - "Title: Aarti & Bhajans"
      interactions:
        - element: "Home feature card"
          action: "tap"
          result: "Open Aarti & Bhajans main page without paywall."
          confidence: "confirmed"
        - element: "Back arrow"
          action: "tap"
          result: "Return to previous screen, usually Home."
          confidence: "assumed"
      rules:
        - "Do not show paywall on module entry."
        - "Do not build top-right nav actions unless confirmed; rendered Figma shows only back and title."

    - id: "main_page"
      name: "Aarti & Bhajans Main Page"
      source: "Figma node 412:2656"
      visible_elements:
        - "Recently Played"
        - "Deities"
        - "Browse Categories"
        - "Newly Added"
        - "Most Played on Prabhuji"
        - "Show all links"
        - "Horizontal audio cards"
        - "Category cards"
        - "Deity avatar cards"
      interactions:
        - element: "Audio card"
          action: "tap"
          result: "Free user opens unified paywall; Pro user opens player and auto-starts selected audio."
          confidence: "confirmed"
        - element: "Show all"
          action: "tap"
          result: "Open reusable 2-column listing page filtered by the tapped section."
          confidence: "confirmed"
        - element: "Category card"
          action: "tap"
          result: "Open reusable 2-column listing page filtered by category."
          confidence: "confirmed"
        - element: "Deity card"
          action: "tap"
          result: "Open reusable 2-column listing page filtered by deity/god."
          confidence: "confirmed"
      rules:
        - "Browse surfaces are free."
        - "No lock badges or Pro labels on cards in Phase 1."
        - "All categories and deities are CMS-controlled."
        - "Long titles may truncate with ellipsis as shown in Figma."

    - id: "recently_played"
      name: "Recently Played"
      source: "Figma node 412:2656"
      visible_elements:
        - "Section title"
        - "Show all link"
        - "Horizontal audio cards"
      interactions:
        - element: "Show all"
          action: "tap"
          result: "Open listing page filtered to recently played items."
          confidence: "confirmed"
        - element: "Audio card"
          action: "tap"
          result: "Apply normal audio item access rule."
          confidence: "confirmed"
      rules:
        - "Hide section if user has no playback history."
        - "Do not show fake recently played items."

    - id: "deities"
      name: "Deities"
      source: "Figma node 412:2656"
      visible_elements:
        - "Horizontal deity avatars"
        - "Deity names"
        - "Show all link"
      interactions:
        - element: "Deity avatar/card"
          action: "tap"
          result: "Open reusable listing filtered by deity/god."
          confidence: "confirmed"
        - element: "Show all"
          action: "tap"
          result: "Open deity listing or expanded deity picker using reusable listing/navigation pattern."
          confidence: "partially_confirmed"
      rules:
        - "CMS controls deity list, images, order, and active state."
        - "Paywall must not appear on deity tap."

    - id: "browse_categories"
      name: "Browse Categories"
      source: "Figma node 412:2656"
      visible_elements:
        - "Prabhuji Originals category card"
        - "Stotram category card"
        - "Aarti category card"
        - "Chalisa category card"
        - "Mantra Jaap category card"
        - "Katha category card"
      interactions:
        - element: "Category card"
          action: "tap"
          result: "Open reusable 2-column listing filtered by category."
          confidence: "confirmed"
        - element: "Show all"
          action: "tap"
          result: "Open all categories or listing using reusable pattern."
          confidence: "partially_confirmed"
      rules:
        - "Visible categories are samples only."
        - "CMS must support creating categories and assigning category tags to audio items."
        - "Stotram, Chalisa, Mantra Jaap, and Katha remain audio categories inside this module in Phase 1."
        - "Do not route these category cards to other modules in Phase 1."

    - id: "newly_added"
      name: "Newly Added"
      source: "Figma node 412:2656"
      visible_elements:
        - "Section title"
        - "Show all link"
        - "Horizontal audio cards"
      interactions:
        - element: "Show all"
          action: "tap"
          result: "Open reusable listing sorted newest first."
          confidence: "confirmed"
        - element: "Audio card"
          action: "tap"
          result: "Apply normal audio item access rule."
          confidence: "confirmed"
      rules:
        - "CMS/API provides item ordering."

    - id: "most_played"
      name: "Most Played on Prabhuji"
      source: "Figma node 412:2656"
      visible_elements:
        - "Section title"
        - "Show all link"
        - "Horizontal audio cards"
      interactions:
        - element: "Show all"
          action: "tap"
          result: "Open reusable listing sorted by most played."
          confidence: "confirmed"
        - element: "Audio card"
          action: "tap"
          result: "Apply normal audio item access rule."
          confidence: "confirmed"
      rules:
        - "Ranking can be CMS-curated or API-computed in Phase 1."

    - id: "listing_page"
      name: "Reusable 2-column Audio Listing"
      source: "Figma node 420:2909"
      visible_elements:
        - "Top nav with back arrow"
        - "Dynamic title, example: Aarti"
        - "Two-column grid"
        - "Audio artwork"
        - "Audio title"
      interactions:
        - element: "Back arrow"
          action: "tap"
          result: "Return to previous main page or source screen."
          confidence: "assumed"
        - element: "Audio grid item"
          action: "tap"
          result: "Free user opens unified paywall; Pro user opens player and auto-starts selected audio."
          confidence: "confirmed"
      rules:
        - "Use this same screen pattern for category, deity, section Show all, recently played, newly added, and most played listings."
        - "Preserve scroll position on paywall cancel where possible."
        - "Use pagination/lazy loading for long lists."

    - id: "player"
      name: "Full Audio Player"
      source: "Figma node 423:4387 and player controls node 423:4384"
      visible_elements:
        - "Back arrow"
        - "Cover art"
        - "Title"
        - "Singer"
        - "Composer"
        - "Like icon and count"
        - "Share icon and count"
        - "Elapsed time"
        - "Total duration"
        - "Progress bar"
        - "Rewind 10 seconds"
        - "Previous track"
        - "Play/pause"
        - "Next track"
        - "Forward 10 seconds"
      interactions:
        - element: "Player open"
          action: "load"
          result: "Auto-start selected audio for Pro user or newly purchased user."
          confidence: "confirmed"
        - element: "Back arrow"
          action: "tap"
          result: "Return to previous browse/listing screen and continue playback through mini-player."
          confidence: "confirmed"
        - element: "Play/pause"
          action: "tap"
          result: "Toggle playback state."
          confidence: "confirmed"
        - element: "Progress bar"
          action: "drag/tap"
          result: "Seek within current audio."
          confidence: "assumed"
        - element: "Rewind 10 seconds"
          action: "tap"
          result: "Move playback back by 10 seconds, clamped at 0."
          confidence: "confirmed"
        - element: "Forward 10 seconds"
          action: "tap"
          result: "Move playback forward by 10 seconds, clamped at duration."
          confidence: "confirmed"
        - element: "Previous track"
          action: "tap"
          result: "Play previous item in current queue, or no-op/disabled at queue start."
          confidence: "confirmed"
        - element: "Next track"
          action: "tap"
          result: "Play next item in current queue, or no-op/disabled at queue end."
          confidence: "confirmed"
        - element: "Like icon"
          action: "tap"
          result: "Toggle like/favorite state and update displayed count optimistically if supported."
          confidence: "confirmed"
        - element: "Share icon"
          action: "tap"
          result: "Open native share sheet with item deep link; WhatsApp is an important destination."
          confidence: "confirmed"
      rules:
        - "Player is Pro-only."
        - "Do not interrupt active playback with aggressive monetization."
        - "At audio completion, auto-play next item within current queue."
        - "At queue end, stop playback. Do not loop endlessly in Phase 1."

    - id: "mini_player"
      name: "In-app Mini-player"
      source: "Confirmed by designer; visual design missing from Figma"
      visible_elements:
        - "Artwork thumbnail"
        - "Audio title"
        - "Play/pause"
        - "Close/dismiss"
      interactions:
        - element: "Mini-player surface"
          action: "tap"
          result: "Reopen full player for current audio."
          confidence: "assumed"
        - element: "Mini-player play/pause"
          action: "tap"
          result: "Toggle current playback."
          confidence: "assumed"
        - element: "Mini-player close/dismiss"
          action: "tap"
          result: "Stop playback and hide mini-player."
          confidence: "assumed"
      rules:
        - "Mini-player appears only after Pro playback starts."
        - "Mini-player remains visible while navigating inside the app."
        - "Mini-player is confirmed for Phase 1 but requires final visual design."

    - id: "unified_paywall_flow"
      name: "Unified Paywall Flow"
      source: "Known paywall node 493:3349; behavior confirmed by designer"
      visible_elements:
        - "Unified Prabhuji VIP Membership paywall"
      interactions:
        - element: "Free user audio item tap"
          action: "tap"
          result: "Open unified paywall and preserve original audio item context."
          confidence: "confirmed"
        - element: "Purchase success"
          action: "complete"
          result: "Open original audio item in player and auto-start playback."
          confidence: "confirmed"
        - element: "Paywall close/cancel"
          action: "tap/system back"
          result: "Return to prior listing/main page without playback."
          confidence: "assumed"
      rules:
        - "Paywall triggers after clear listening intent only."
        - "Use unified MVP paywall. No contextual paywall variants in Phase 1."

audio_behavior:
  playback_access:
    free_user: "blocked_by_unified_paywall_on_audio_item_tap"
    pro_user: "allowed"
    confidence: "confirmed"
  auto_start_on_player_open:
    enabled: true
    confidence: "confirmed"
  queue:
    source: "current source list or section"
    examples:
      - "Aarti category listing"
      - "Hanuman ji deity listing"
      - "Recently Played listing"
      - "Newly Added listing"
      - "Most Played listing"
    previous_next_behavior: "Move within current queue. Disable or no-op at boundaries."
    completion_behavior: "Auto-play next item in current queue. Stop at the end."
    looping_phase_1: false
    confidence: "confirmed"
  controls:
    play_pause: "Toggle playback"
    rewind_10_seconds: "Seek backward 10 seconds, clamped at start"
    forward_10_seconds: "Seek forward 10 seconds, clamped at duration"
    previous_track: "Previous queue item"
    next_track: "Next queue item"
    progress_bar: "Display elapsed and total duration; user seek assumed"
  mini_player:
    required_phase_1: true
    visual_design_available: false
    display_condition: "Show after Pro playback has started and user leaves full player."
    tap_behavior: "Reopen full player"
    close_behavior: "Stop playback and dismiss mini-player"
    confidence: "partially_confirmed"

