engagement_rules:
  like_favorite:
    available_to: "Pro users from player"
    behavior: "Toggle like/favorite state and show total like count."
    login_prompt: "Do not add extra login prompt unless account/session state is missing."
    phase_2: "Liked/favorite library"
    confidence: "confirmed"
  share:
    available_to: "Pro users from player in Phase 1"
    behavior: "Open native share sheet with item deep link."
    important_destination: "WhatsApp"
    recipient_behavior: "Free recipient can view/browse but must subscribe before playback."
    confidence: "confirmed"

data_requirements:
  cms:
    audio_item:
      required_fields:
        - "id"
        - "title"
        - "cover_image_url"
        - "audio_stream_url"
        - "duration_seconds"
        - "category_tags"
        - "deity_tags"
        - "is_active"
        - "sort_order"
      recommended_fields:
        - "singer_name"
        - "composer_names"
        - "language"
        - "description"
        - "published_at"
        - "like_count"
        - "share_count"
        - "play_count"
        - "is_featured"
        - "is_prabhuji_original"
        - "thumbnail_alt_text"
        - "audio_bitrate"
        - "content_rights_status"
      access_fields:
        - "requires_pro_for_playback: default true for this module"
    audio_category:
      required_fields:
        - "id"
        - "name"
        - "image_url"
        - "sort_order"
        - "is_active"
      recommended_fields:
        - "slug"
        - "description"
        - "display_color"
    deity:
      required_fields:
        - "id"
        - "name"
        - "image_url"
        - "sort_order"
        - "is_active"
      recommended_fields:
        - "slug"
        - "alternate_names"
    homepage_sections:
      required_fields:
        - "section_id"
        - "section_type"
        - "title"
        - "item_ids_or_query"
        - "sort_order"
        - "is_active"
      supported_section_types:
        - "recently_played"
        - "deities"
        - "browse_categories"
        - "newly_added"
        - "most_played"
    user_playback_history:
      required_fields:
        - "user_id"
        - "audio_id"
        - "last_played_at"
      recommended_fields:
        - "last_position_seconds"
        - "completed_count"
  api:
    listing_query_parameters:
      - "category_id"
      - "deity_id"
      - "section_type"
      - "sort"
      - "page"
      - "page_size"
    paywall_continuation_parameters:
      - "audio_id"
      - "source_list_type"
      - "source_filter"
      - "queue_item_ids_or_query"
  local_state:
    player_state:
      - "current_audio_id"
      - "queue_context"
      - "elapsed_seconds"
      - "is_playing"
      - "mini_player_visible"

states:
  loading:
    description: "Show lightweight skeletons/placeholders for sections and artwork. Do not block the whole page if one section is still loading."
  empty_main:
    description: "If all CMS audio/category/deity content is empty, show a calm empty state and keep top nav visible."
    suggested_copy: "No audio available right now. Please try again later."
  empty_recently_played:
    description: "Hide Recently Played when user has no playback history."
  empty_listing:
    description: "Show a simple empty state for category/deity/section listings with no results."
    suggested_copy: "No audio found here yet."
  partial_cms_failure:
    description: "Hide or retry the failed section while keeping working sections visible."
  full_cms_failure:
    description: "Show retry state. Do not show paywall."
  paywall_cancelled:
    description: "Return to previous browse/listing context without playback. Preserve scroll position where possible."
  purchase_success:
    description: "Open original tapped audio item and auto-start playback with preserved queue context."
  audio_loading:
    description: "Show player loading/buffer state while audio stream initializes."
  audio_error:
    description: "Show retry message inside player. Do not auto-skip unless user taps next."
    suggested_copy: "This audio could not play. Please try again."
  offline:
    description: "No offline downloads in Phase 1. Show retry/offline messaging when data or stream cannot load."
  queue_end:
    description: "Stop playback when the final item in the queue completes. Do not loop endlessly in Phase 1."

