qa_checks:
  - "A free user can open Aarti & Bhajans without seeing a paywall."
  - "A free user can open category listings without seeing a paywall."
  - "A free user can open deity listings without seeing a paywall."
  - "A free user sees the unified paywall only after tapping an audio item."
  - "After successful purchase from an audio item paywall, the originally tapped item opens and starts playing."
  - "Cancelling the paywall returns the user to the previous browse or listing context without playback."
  - "A Pro user tapping an audio item opens the player and audio auto-starts."
  - "Recently Played is hidden when the user has no playback history."
