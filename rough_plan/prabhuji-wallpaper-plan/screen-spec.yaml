  app: Prabhuji
  module: Wallpaper
  screen_or_flow: Module Spec
  version: v1.0
  status: approved
  package_type: module_wise_design_execution_package
  approval_required_before_export: false
  recommended_drive_wiki_path: Prabhuji / Wallpaper / Module Spec / v1.0

source:
  figma_file_key: ipSvV1FnmzvV8TK2Ig8Aiq
  figma_urls:
    main_module: https://www.figma.com/design/ipSvV1FnmzvV8TK2Ig8Aiq/Prabhuji?node-id=712-7121&t=TzCwzI6RZASLubyK-1
    wallpaper_home: https://www.figma.com/design/ipSvV1FnmzvV8TK2Ig8Aiq/Prabhuji?node-id=704-5223&t=TzCwzI6RZASLubyK-1
    deity_listing: https://www.figma.com/design/ipSvV1FnmzvV8TK2Ig8Aiq/Prabhuji?node-id=707-6427&t=TzCwzI6RZASLubyK-1
    static_preview: https://www.figma.com/design/ipSvV1FnmzvV8TK2Ig8Aiq/Prabhuji?node-id=282-2812&t=TzCwzI6RZASLubyK-1
    live_preview: https://www.figma.com/design/ipSvV1FnmzvV8TK2Ig8Aiq/Prabhuji?node-id=712-6622&t=TzCwzI6RZASLubyK-1
